[package]
name = "revel-git"
description = "Git et GitHub : publication d'un dossier sur une branche, connexion GitHub (device flow), API Pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["github"]
# Client de l'API GitHub (connexion, Pages). Sans elle : publication Git seule.
github = ["dep:ureq"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# libgit2 compilée dans Revel (D-12) ; HTTPS par la pile du système (WinHTTP, Secure Transport,
# OpenSSL sous Linux). Pas de SSH : GitHub est joint en HTTPS avec un jeton.
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2"] }
# Client HTTP synchrone, TLS en Rust (rustls) avec les certificats racine du système
# (indispensable derrière un proxy d'entreprise ou un antivirus qui inspecte HTTPS).
ureq = { version = "3.4.2", features = ["json", "platform-verifier"], optional = true }

# macOS : libgit2 utilise la pile TLS d'Apple (Secure Transport), mais libgit2-sys dépend quand même
# d'openssl-sys sur tous les Unix. Compilée dans Revel (« vendored ») plutôt que liée à l'OpenSSL de
# Homebrew : sans cela, l'application exigeait /opt/homebrew/opt/openssl@3 au lancement, et la
# compilation pour les Mac Intel depuis un Mac Apple Silicon échouait.
[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9.117", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
