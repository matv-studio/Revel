# Interface de Revel (Leptos, WebAssembly). Construite par Trunk, hors de l'espace de travail
# principal (cible wasm32) ; partage revel-protocol et revel-i18n avec le cœur.
[package]
name = "revel-ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
revel-protocol = { path = "../../crates/revel-protocol" }
revel-i18n = { path = "../../crates/revel-i18n" }
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Element", "HtmlElement", "CssStyleDeclaration"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
