[package]
name = "revel-mcp"
description = "Serveur MCP de Revel : outils d'édition pour tout assistant (stdio relayé, HTTP en flux local)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
revel-model.workspace = true
revel-edit.workspace = true
revel-markup.workspace = true
revel-protocol.workspace = true
revel-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "form", "query"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "macros", "io-std", "time"] }
tokio-util = "0.7.20"
ureq = "3.4.2"
getrandom = "0.3.4"
sha2 = "0.10.9"
blake3 = "1.8.7"
base64 = "0.22.1"
revel-core = { workspace = true, optional = true, default-features = false }

[features]
# Outils branchés directement sur le cœur (application, ligne de commande).
core = ["dep:revel-core"]

[dev-dependencies]
revel-core = { workspace = true, default-features = false }
tempfile = "3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
