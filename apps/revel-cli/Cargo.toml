[package]
name = "revel-cli"
description = "Revel en ligne de commande (tests, diagnostic)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "revel"
path = "src/main.rs"

[dependencies]
revel-model.workspace = true
revel-edit.workspace = true
revel-style.workspace = true
serde_json.workspace = true
revel-project.workspace = true
revel-render.workspace = true
revel-import.workspace = true
revel-deploy.workspace = true
revel-i18n.workspace = true
# Canevas de l'éditeur servi en HTTP local (diagnostic, essais de bout en bout) ; sans trousseau.
revel-core = { workspace = true, default-features = false }
revel-protocol.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "macros", "signal"] }

[lints]
workspace = true
