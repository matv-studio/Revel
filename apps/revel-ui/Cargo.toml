# Interface de Revel (Leptos, WebAssembly). Construite par Trunk, hors de l'espace de travail
# principal (cible wasm32) ; partage revel-protocol, revel-i18n, revel-model et revel-edit avec
# le cœur.
[package]
name = "revel-ui"
version = "0.6.1"
edition = "2024"
publish = false

[dependencies]
revel-protocol = { path = "../../crates/revel-protocol" }
revel-i18n = { path = "../../crates/revel-i18n" }
# Document du site et commandes d'édition (copie locale tenue à jour, D-13).
revel-model = { path = "../../crates/revel-model" }
revel-edit = { path = "../../crates/revel-edit" }
# Valeurs CSS du panneau de styles : couleurs, nombres, raccourcis, ombres (D-20).
revel-style = { path = "../../crates/revel-style" }
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
# Fin d'une publication attendue avant la suivante (publication vers plusieurs hébergements).
futures-channel = "0.3.34"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Element", "HtmlElement", "CssStyleDeclaration", "HtmlIFrameElement", "MessageEvent",
    "Window", "KeyboardEvent", "DomRect", "EventTarget", "HtmlSelectElement", "DragEvent",
    "DataTransfer", "ScrollIntoViewOptions", "ScrollLogicalPosition", "PointerEvent", "MouseEvent",
    "HtmlInputElement", "ResizeObserver", "Storage", "NodeList", "WheelEvent",
    "Node", "Text", "Document", "ClipboardEvent", "Selection", "Range", "HtmlDocument",
    "FocusEvent", "InputEvent", "HtmlCanvasElement", "CanvasRenderingContext2d",
    "HtmlTemplateElement", "DocumentFragment",
    "AddEventListenerOptions", "HtmlTextAreaElement", "HtmlDetailsElement", "File", "FileList", "Blob", "HtmlImageElement",
] }
# Texte riche en Markdown (vue CMS) : Markdown -> HTML dans l'éditeur visuel (même lecteur que
# la génération du site).
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# Construction de développement : numéros de ligne seulement dans les informations de débogage
# (sinon le fichier .wasm dépasse un gigaoctet) ; les messages de panique restent situés.
[profile.dev]
debug = "line-tables-only"
