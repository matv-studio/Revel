# Configuration de Pages CMS (https://pagescms.org), lue aussi par Revel.
media:
  input: media
  output: /media
content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    filename: "{fields.slug}.md"
    view:
      fields: [title, category, date]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: "[[Titre||Title]]"
        type: string
        required: true
      - name: slug
        label: "[[Adresse de la page||Page address]]"
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: category
        label: "[[Catégorie||Category]]"
        type: select
        options:
          values: ["[[Voyage||Travel]]", "Design", "[[Cuisine||Food]]", "Nature"]
      - name: description
        label: "[[Résumé||Summary]]"
        type: text
      - name: image
        label: Image
        type: image
      - name: body
        label: "[[Texte||Text]]"
        type: rich-text
