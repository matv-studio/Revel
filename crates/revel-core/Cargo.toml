[package]
name = "revel-core"
description = "Services de Revel : sites, import, génération, aperçu, publication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["keyring"]
# Trousseau du système (désactivable pour les essais sans session graphique).
keyring = ["dep:keyring"]

[dependencies]
revel-model.workspace = true
revel-project.workspace = true
revel-import.workspace = true
revel-deploy.workspace = true
revel-protocol.workspace = true
revel-git.workspace = true
revel-edit.workspace = true
revel-render.workspace = true
revel-style.workspace = true
revel-assets.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.6.11", features = ["fs"] }
keyring = { version = "4.2.0", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util"] }

[lints]
workspace = true
