[package]
name = "revel-app"
description = "Application de bureau Revel (coque Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "revel_app_lib"
# Bureau uniquement : les formats « staticlib » et « cdylib » du modèle Tauri ne servent qu'aux
# versions mobiles et alourdissent fortement la compilation (plusieurs Go en développement).
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
revel-core.workspace = true
revel-model.workspace = true
revel-protocol.workspace = true
base64 = "0.22.1"
revel-edit.workspace = true
# Serveur des assistants IA (MCP, étape 4) branché sur le cœur de l'application.
revel-mcp = { workspace = true, features = ["core"] }
serde.workspace = true
# Lu par `tauri::generate_context!` pour la configuration des modules (mises à jour).
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "2.8.2"
# Ouverture d'adresses dans le navigateur (github.com/login/device, site publié).
tauri-plugin-opener = "2.7.1"
# Mises à jour de Revel (6.6) : versions publiées sur GitHub, vérifiées par signature.
tauri-plugin-updater = "2.14.0"

# Chemins des dossiers déposés sur la fenêtre (D-122) : objets joints aux messages de WebView2.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"

[features]
# Interface intégrée à l'exécutable (au lieu du serveur de développement `devUrl`) : activée par
# `cargo tauri build` ; à demander pour un exécutable de débogage (essais de l'application).
custom-protocol = ["tauri/custom-protocol"]

# Règles de l'espace de travail, sauf `unsafe_code` refusé sans être interdit : la lecture des
# fichiers déposés (WebView2, D-122) appelle des interfaces COM, seul code `unsafe` autorisé.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
