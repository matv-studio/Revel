# Installateurs Windows (MSI/NSIS), macOS (DMG) et Linux (AppImage/deb/rpm).
# Déclenché par une étiquette `v*` (ex. v0.1.0) ou à la main. Crée une version
# GitHub en brouillon : rien n'est publié sans validation manuelle.
# Référence : https://tauri.app/distribute/pipelines/github/
name: Installateurs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      plateformes:
        description: "Systèmes à construire"
        type: choice
        options: [tous, windows, macos, linux]
        default: tous

jobs:
  # Systèmes à construire (lancement manuel : seulement ceux demandés, les minutes macOS sont coûteuses).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        env:
          CHOIX: ${{ inputs.plateformes || 'tous' }}
        run: |
          # Ubuntu 22.04 : glibc plus ancienne, AppImage compatible avec plus de distributions.
          all='[
            {"platform":"macos-latest","target":"aarch64-apple-darwin","os":"macos"},
            {"platform":"macos-latest","target":"x86_64-apple-darwin","os":"macos"},
            {"platform":"ubuntu-22.04","target":"","os":"linux"},
            {"platform":"windows-latest","target":"","os":"windows"}]'
          if [ "$CHOIX" = "tous" ]; then sel="$all"; else sel=$(echo "$all" | jq -c --arg o "$CHOIX" '[.[] | select(.os == $o)]'); fi
          echo "matrix=$(echo "$sel" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  # Langues de traduction livrées (D-36 : français et anglais), communes à tous les systèmes :
  # téléchargées une fois depuis Hugging Face (révisions et empreintes figées dans
  # crates/revel-translate/src/catalog.rs, comme depuis les réglages de l'application), préparées,
  # transmises aux installateurs.
  modeles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust (version de rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Préparation
        run: cargo run --release -q -p revel-translate --features download --example preparer -- apps/revel-app/models fr
      - name: Vérification
        shell: bash
        run: |
          n=$(find apps/revel-app/models -name model.safetensors | wc -l)
          du -sh apps/revel-app/models/*/ | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -ne 2 ]; then echo "::error::$n modèles préparés sur 2"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: modeles
          path: apps/revel-app/models/
          retention-days: 1
          compression-level: 0

  bundle:
    needs: [plan, modeles]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      # Modèles de traduction inclus dans l'installateur (ressources Tauri, dossier models/).
      - uses: actions/download-artifact@v8
        with:
          name: modeles
          path: apps/revel-app/models/
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      # NASM : encodeur AVIF (rav1e) optimisé.
      - uses: ilammy/setup-nasm@v1
      - name: Rust (version de rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.target }}" ]; then rustup target add ${{ matrix.target }}; fi
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Outil Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/revel-app
          tauriScript: cargo tauri
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: v__VERSION__
          releaseName: Revel v__VERSION__
          releaseBody: Installateurs de test, non signés.
          releaseDraft: true
          prerelease: true
      # L'application ne doit dépendre que de bibliothèques présentes sur tout système
      # (pas de Homebrew sous macOS : rien n'y est installé chez l'utilisateur).
      - name: Bibliothèques liées (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bin=$(ls target/${{ matrix.target }}/release/revel-app 2>/dev/null || ls target/release/revel-app)
          otool -L "$bin" | tee -a "$GITHUB_STEP_SUMMARY"
          if otool -L "$bin" | grep -E '/opt/homebrew|/usr/local/(opt|Cellar|lib)'; then
            echo "::error::L'application dépend d'une bibliothèque Homebrew"; exit 1
          fi
      - name: Bibliothèques liées (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ldd target/release/revel-app | tee -a "$GITHUB_STEP_SUMMARY"
          if ldd target/release/revel-app | grep 'not found'; then exit 1; fi
