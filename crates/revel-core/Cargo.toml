[package]
name = "revel-core"
description = "Services de Revel : sites, import, génération, aperçu, publication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["keyring"]
# Trousseau du système (désactivable pour les essais sans session graphique).
keyring = ["dep:keyring"]

[dependencies]
base64 = "0.22.1"
revel-model.workspace = true
revel-markup.workspace = true
revel-project.workspace = true
revel-import.workspace = true
# Construction des sites par Revel (D-88).
revel-build.workspace = true
revel-deploy.workspace = true
revel-protocol.workspace = true
revel-git.workspace = true
revel-edit.workspace = true
revel-render.workspace = true
revel-style.workspace = true
revel-assets.workspace = true
revel-translate = { workspace = true, features = ["download"] }
serde.workspace = true
serde_json.workspace = true
# Réserve des publications (revenir à la précédente, 5.5) : fichiers rangés par empreinte.
blake3 = "1.8.7"
thiserror.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.6.11", features = ["fs"] }
keyring = { version = "4.2.0", optional = true }
# Polices Google téléchargées dans le site (D-24) : client HTTP synchrone, certificats du système.
ureq = { version = "3.4.2", features = ["platform-verifier"] }
# Préversions (D-86) : numéros de version des étiquettes comparés.
semver = "1.0.28"
# Animations Lottie en archive `.lottie` (LottieFiles) : animation extraite à l'import (6.2).
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Suppression d'un site depuis l'accueil : dossier mis à la corbeille du système (récupérable).
trash = "5.2.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util"] }

[lints]
workspace = true
