# Vérifications : format, analyse, tests, sous Linux, Windows et macOS.
# Dépôt public : minutes d'Actions gratuites sur les machines standard de GitHub.
# Si le dépôt redevient privé, les envois sur main ne testent plus que Linux (minutes limitées,
# macOS et Windows décomptés plus vite) ; le lancement manuel teste toujours les trois systèmes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Version du site cobaye utilisée par les essais ; à mettre à jour volontairement (dépôt
  # matv-studio/alunites-revel-lab).
  COBAYE_REF: 0dd004c165bae249ff9af6e2779a00eabc313015

jobs:
  lint:
    name: Format et analyse (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # NASM : encodeur AVIF (rav1e) optimisé.
      - uses: ilammy/setup-nasm@v1
      - name: Rust (version de rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Interface Leptos (WebAssembly)
        working-directory: apps/revel-ui
        run: trunk build --release
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path apps/revel-ui/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/revel-ui/Cargo.toml --target wasm32-unknown-unknown
      # Fonctions pures de l'interface (expressions littérales…), essayées sur la machine hôte.
      - run: cargo test --manifest-path apps/revel-ui/Cargo.toml
      - run: cargo clippy --workspace --all-targets
      # Chaque module doit compiler avec ses fonctions désactivées (retour arrière possible).
      - run: cargo clippy -p revel-deploy --no-default-features

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' && github.event.repository.private) && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Les machines Linux de GitHub n'ont qu'environ 14 Go libres : retrait d'outils préinstallés inutiles ici.
      - name: Espace disque (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Dépendances système de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # NASM : encodeur AVIF (rav1e) optimisé.
      - uses: ilammy/setup-nasm@v1
      - name: Rust (version de rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Interface Leptos (WebAssembly)
        working-directory: apps/revel-ui
        run: trunk build --release
      - run: cargo test --workspace
      - name: Essai de la ligne de commande
        shell: bash
        run: |
          cargo run -q -p revel-cli -- info
          cargo run -q -p revel-cli -- check-host github-pages --redirects 3 --php 1

  sftp:
    name: Publication SFTP (serveur OpenSSH local)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Serveur SFTP d'essai
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo useradd -m revel
          PASS=$(openssl rand -hex 12)
          echo "revel:$PASS" | sudo chpasswd
          echo "REVEL_SFTP_PASSWORD=$PASS" >> "$GITHUB_ENV"
          mkdir -p /tmp/sshd && ssh-keygen -q -t ed25519 -N "" -f /tmp/sshd/host
          printf 'Port 2222\nListenAddress 127.0.0.1\nHostKey /tmp/sshd/host\nPasswordAuthentication yes\nUsePAM yes\nPidFile /tmp/sshd/pid\nSubsystem sftp /usr/lib/openssh/sftp-server\n' > /tmp/sshd/config
          sudo mkdir -p /run/sshd && sudo /usr/sbin/sshd -f /tmp/sshd/config
          sudo chmod o+rx /home/revel
      # NASM : encodeur AVIF (rav1e) optimisé.
      - uses: ilammy/setup-nasm@v1
      - name: Rust (version de rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Essai de publication
        env:
          REVEL_SFTP_HOST: 127.0.0.1
          REVEL_SFTP_PORT: "2222"
          REVEL_SFTP_USER: revel
          REVEL_SFTP_HOME: /home/revel
        run: |
          sudo -E env "PATH=$PATH" cargo test -p revel-deploy --test sftp_local
          sudo -E env "PATH=$PATH" cargo test -p revel-core --no-default-features publication_par_le_coeur

  # Critère d'acceptation de l'étape 1 : le site cobaye généré par Revel est équivalent à celui
  # d'Eleventy (pages, titres et balises SEO, texte visible, liens, redirections, fichiers copiés),
  # en production et en recette. Variantes d'images exclues (noms propres à chaque outil ; rendu
  # vérifié par captures à l'étape 1.4).
  equivalence:
    name: Équivalence avec Eleventy (site cobaye)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: matv-studio/alunites-revel-lab
          ref: ${{ env.COBAYE_REF }}
          path: cobaye
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cobaye/package-lock.json
      - name: Dépendances Eleventy
        working-directory: cobaye
        run: npm ci --no-audit --no-fund
      # Images responsives d'Eleventy : longues à produire la première fois, réutilisées ensuite.
      - name: Cache des images d'Eleventy
        uses: actions/cache@v5
        with:
          path: cobaye/_site/img
          key: eleventy-img-${{ hashFiles('cobaye/src/media/**', 'cobaye/eleventy.config.js') }}
          restore-keys: eleventy-img-
      - name: Référence Eleventy (production et recette)
        working-directory: cobaye
        run: |
          npx @11ty/eleventy --quiet
          SITE_ENV=staging npx @11ty/eleventy --quiet --output=../eleventy-staging
      # NASM : encodeur AVIF (rav1e) optimisé.
      - uses: ilammy/setup-nasm@v1
      - name: Rust (version de rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Import et génération par Revel
        run: |
          cargo build -q --release -p revel-cli
          REVEL=target/release/revel
          $REVEL import-eleventy cobaye
          # Le fichier du cobaye doit correspondre à ce que produit l'importeur actuel.
          if ! git -C cobaye diff --quiet -- site.revel.json; then
            echo "::warning::site.revel.json du cobaye diffère de l'import actuel : mettre à jour le dépôt cobaye et COBAYE_REF."
          fi
          $REVEL build cobaye --out revel-production --no-images
          $REVEL build cobaye --out revel-staging --env staging --no-images
      - name: Comparaison
        shell: bash  # avec « pipefail » : un écart fait échouer l'étape malgré « tee »
        env:
          # Feuilles de style comparées après normalisation (`revel css-canon`) : le CSS publié est
          # généré par Revel (D-18), sa mise en forme diffère de l'original.
          REVEL_BIN: target/release/revel
        run: |
          python3 -m pip install -q --break-system-packages beautifulsoup4 lxml
          echo "## Production" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/compare-sites.py cobaye/_site revel-production --details | tee -a "$GITHUB_STEP_SUMMARY"
          echo "## Recette" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/compare-sites.py eleventy-staging revel-staging --details | tee -a "$GITHUB_STEP_SUMMARY"
      # Le CSS généré par Revel doit produire exactement les mêmes styles que le CSS d'origine :
      # styles calculés de chaque élément comparés dans Chromium (tools/compare-styles.mjs).
      - name: Styles (CSS d'origine contre CSS généré)
        shell: bash
        run: |
          url=$(jq -r '.stylesheet.url' cobaye/site.revel.json)
          source=$(jq -r '.stylesheet.source' cobaye/site.revel.json)
          cp -r revel-production styles-origine
          cp "cobaye/$source" "styles-origine$url"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.63.0
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          # Largeurs : ordinateur, chaque point de rupture (limite incluse), mobile.
          widths=$(jq -r '[1280] + [.breakpoints[] | .max_width // empty] + [375] | join(",")' cobaye/site.revel.json)
          echo "## Styles calculés et captures ($widths px)" >> "$GITHUB_STEP_SUMMARY"
          node tools/compare-styles.mjs styles-origine revel-production --jobs 4 --shots --widths "$widths" \
            --save captures-ecarts \
            --pages /,/agence/,/projets/,/contact/,/actualites/,/mentions-legales/,/404.html,/faire-un-film-ia/,/expertise/film-storytelling/,/project/wattr/,/showreel/ \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # Canevas de l'éditeur (étape 2.2) : chaque page, repères retirés, identique à la page
      # générée ; servi comme par l'application, il donne les mêmes styles et captures que le site,
      # et répond à la souris et aux messages de l'interface.
      - name: Canevas de l'éditeur
        shell: bash
        run: |
          REVEL=target/release/revel
          echo "## Canevas" >> "$GITHUB_STEP_SUMMARY"
          $REVEL canvas-check cobaye | tee -a "$GITHUB_STEP_SUMMARY"
          $REVEL canvas-serve cobaye --port 8160 --scripts --no-images > canvas-serve.log 2>&1 &
          $REVEL canvas-serve cobaye --port 8161 > canvas-serve-sans-scripts.log 2>&1 &
          sleep 2
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node tools/compare-styles.mjs revel-production http://127.0.0.1:8160 --jobs 4 --shots \
            --widths 1280,860,375 --save captures-ecarts \
            --pages /,/agence/,/projets/,/contact/,/faire-un-film-ia/,/project/wattr/ \
            | tee -a "$GITHUB_STEP_SUMMARY"
          for page in / /agence/ /project/wattr/; do
            node tools/canvas-e2e.mjs http://127.0.0.1:8160 "$page" | tee -a "$GITHUB_STEP_SUMMARY"
            node tools/canvas-e2e.mjs http://127.0.0.1:8161 "$page" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      # Éditeur (étape 2.3) : interface servie dans Chromium avec l'API Tauri simulée, reliée à un
      # vrai cœur (`canvas-serve --bridge`) sur une copie du cobaye.
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Interface (pour les essais dans un navigateur)
        working-directory: apps/revel-ui
        run: trunk build --release
      - name: Éditeur de bout en bout
        shell: bash
        run: |
          mkdir cobaye-essai
          tar --exclude=./node_modules --exclude=./_site --exclude=./.git -C cobaye -cf - . | tar -C cobaye-essai -xf -
          target/release/revel canvas-serve cobaye-essai --port 8162 --bridge > pont.log 2>&1 &
          python3 -m http.server 8170 --bind 127.0.0.1 --directory apps/revel-ui/dist > /dev/null 2>&1 &
          sleep 2
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          echo "## Éditeur" >> "$GITHUB_STEP_SUMMARY"
          node tools/editor-e2e.mjs http://127.0.0.1:8170 http://127.0.0.1:8162 captures-ecarts/editeur cobaye-essai | tee -a "$GITHUB_STEP_SUMMARY"
          # Les essais annulent tout : copie identique au cobaye (document, données, contenus).
          cmp cobaye/site.revel.json cobaye-essai/site.revel.json
          diff -r cobaye/src cobaye-essai/src
      - name: Captures en écart
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: captures-ecarts
          path: captures-ecarts
          if-no-files-found: ignore
          retention-days: 7

  # Application de bureau (étape 2.9) : la vraie application Tauri (interface intégrée, commandes et
  # protocole du canevas réels) pilotée par WebDriver avec tauri-driver, ouverte sur une copie du
  # cobaye ; modifications annulées, copie comparée à l'original. Linux : WebKitWebDriver dans un
  # écran virtuel (Xvfb) ; Windows : Edge WebDriver de la version de WebView2 installée. macOS : pas
  # de pilote WebDriver pour WKWebView.
  app:
    name: Application de bureau (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: matv-studio/alunites-revel-lab
          ref: ${{ env.COBAYE_REF }}
          path: cobaye
      - name: Espace disque (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Dépendances système de Tauri et WebKitWebDriver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      # NASM : encodeur AVIF (rav1e) optimisé.
      - uses: ilammy/setup-nasm@v1
      - name: Rust (version de rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Interface Leptos (WebAssembly)
        working-directory: apps/revel-ui
        run: trunk build --release
      - name: Application (débogage, interface intégrée)
        run: cargo build -p revel-app --features custom-protocol
      # Outils d'essai : avertissements de compilation tolérés (code tiers).
      - name: tauri-driver
        env:
          RUSTFLAGS: ""
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Edge WebDriver (Windows)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: ""
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Essai de bout en bout
        shell: bash
        run: |
          mkdir site-essai
          tar --exclude=./.git -C cobaye -cf - . | tar -C site-essai -xf -
          mkdir captures-application
          run() {
            tauri-driver > tauri-driver.log 2>&1 &
            local driver=$! code=0
            sleep 3
            node tools/app-e2e.mjs target/debug/revel-app --open site-essai --shot captures-application/application.png || code=$?
            kill "$driver" 2>/dev/null || true
            return "$code"
          }
          if [ "$RUNNER_OS" = Linux ]; then
            export -f run
            xvfb-run -a -s "-screen 0 1440x900x24" bash -c run | tee -a "$GITHUB_STEP_SUMMARY"
          else
            run | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Les essais annulent tout : copie identique au cobaye.
          diff -r --exclude=.git cobaye site-essai
      - name: Captures et journal
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: application-${{ matrix.os }}
          path: |
            captures-application
            tauri-driver.log
          if-no-files-found: ignore
          retention-days: 7
