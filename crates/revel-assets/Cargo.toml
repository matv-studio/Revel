[package]
name = "revel-assets"
description = "Images responsives (AVIF, WebP, JPEG, PNG) avec cache, images de partage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
revel-model.workspace = true
revel-render.workspace = true
serde_json.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
ravif = "0.13.0"
rgb = "0.8"
webp = "0.3.1"
jpeg-encoder = "0.7.1"
blake3 = "1.8.7"
base64 = "0.22"
rayon = "1.12.0"
url = "2.5.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
