[package]
name = "revel-build"
description = "Construction des sites faits avec un générateur (SvelteKit, Astro, Next.js, Hugo, Jekyll…) : outils téléchargés et vérifiés, dépendances installées, site construit ou servi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Téléchargement des outils (Node.js, Hugo) : client HTTP synchrone, certificats du système.
ureq = { version = "3.4.2", features = ["platform-verifier"] }
# Empreintes publiées avec les outils (SHA-256).
sha2 = "0.10.9"
# Archives des outils : .tar.gz (Linux, macOS), .zip (Windows).
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
semver = "1.0.28"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
