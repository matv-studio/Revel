media:
  input: media
  output: /media
content:
  - name: stories
    label: Articles
    type: collection
    path: content/stories
    filename: "{fields.slug}.md"
    view:
      fields: [title, section, date]
      primary: title
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: "[[Titre||Title]]", type: string, required: true }
      - { name: slug, label: "[[Adresse de la page||Page address]]", type: string, required: true }
      - { name: date, label: Date, type: date }
      - name: section
        label: "[[Rubrique||Section]]"
        type: select
        options:
          values: ["Culture", "[[Sciences||Science]]", "[[Société||Society]]", "[[Voyage||Travel]]"]
      - { name: author, label: "[[Auteur||Author]]", type: string }
      - { name: description, label: "[[Chapeau||Standfirst]]", type: text }
      - { name: image, label: Image, type: image }
      - { name: body, label: "[[Texte||Text]]", type: rich-text }
