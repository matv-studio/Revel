[package]
name = "revel-deploy"
description = "Publication : trait Provider et capacités des hébergeurs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Chaque hébergeur peut être retiré de la compilation sans toucher au reste.
default = ["github-pages", "sftp", "cloudflare"]
github-pages = []
sftp = ["dep:russh", "dep:russh-sftp", "dep:tokio"]
cloudflare = []

[dependencies]
serde.workspace = true
thiserror.workspace = true
sha1 = "0.11.0"
# Pile SSH en Rust ; « ring » pour la cryptographie (pas de dépendance à CMake).
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"], optional = true }
russh-sftp = { version = "3.0.1", optional = true }
tokio = { version = "1.53.2", features = ["rt", "fs", "sync", "macros"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "time"] }

[lints]
workspace = true
