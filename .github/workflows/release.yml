# Installateurs Windows (MSI/NSIS), macOS (DMG) et Linux (AppImage/deb/rpm).
# Déclenché par une étiquette `v*` (ex. v0.1.0) ou à la main. Crée une version
# GitHub en brouillon : rien n'est publié sans validation manuelle.
# Référence : https://tauri.app/distribute/pipelines/github/
name: Installateurs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      plateformes:
        description: "Systèmes à construire"
        type: choice
        options: [tous, windows, macos, linux]
        default: tous

jobs:
  # Systèmes à construire (lancement manuel : seulement ceux demandés, les minutes macOS sont coûteuses).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          v=$(jq -r .version apps/revel-app/tauri.conf.json)
          echo "Version $v" >> "$GITHUB_STEP_SUMMARY"
      - id: m
        shell: bash
        env:
          CHOIX: ${{ inputs.plateformes || 'tous' }}
        run: |
          # Ubuntu 22.04 : glibc plus ancienne, AppImage compatible avec plus de distributions.
          all='[
            {"platform":"macos-latest","target":"aarch64-apple-darwin","os":"macos"},
            {"platform":"macos-latest","target":"x86_64-apple-darwin","os":"macos"},
            {"platform":"ubuntu-22.04","target":"","os":"linux"},
            {"platform":"windows-latest","target":"","os":"windows"}]'
          if [ "$CHOIX" = "tous" ]; then sel="$all"; else sel=$(echo "$all" | jq -c --arg o "$CHOIX" '[.[] | select(.os == $o)]'); fi
          echo "matrix=$(echo "$sel" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  bundle:
    needs: plan
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      # Aucune langue de traduction livrée (D-79) : toutes se téléchargent depuis Réglages ›
      # Traduction automatique.
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      # NASM : encodeur AVIF (rav1e) optimisé.
      - uses: ilammy/setup-nasm@v1
      - name: Rust (version de rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.target }}" ]; then rustup target add ${{ matrix.target }}; fi
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Outil Tauri
        run: cargo install tauri-cli --version "^2" --locked
      # Configuration ajoutée selon les secrets et variables déclarés dans le dépôt (aucun n'est
      # obligatoire ; sans eux, installateurs non signés, sans mise à jour automatique) :
      # - mises à jour (6.6) : secret TAURI_SIGNING_PRIVATE_KEY (et son mot de passe), variable
      #   TAURI_UPDATER_PUBKEY ;
      # - macOS (6.7) : secrets APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   et pour la notarisation APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID ; sans certificat,
      #   signature ad hoc ;
      # - Windows (6.7) : Azure Artifact Signing, secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #   AZURE_TENANT_ID et variables ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT,
      #   ARTIFACT_SIGNING_PROFILE.
      - name: Signatures et mises à jour
        id: conf
        shell: bash
        env:
          MAJ: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          MAC: ${{ secrets.APPLE_CERTIFICATE != '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN: ${{ secrets.AZURE_CLIENT_ID != '' && vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGN_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          conf='{}'
          add() { conf=$(jq -c --argjson a "$1" '. * $a' <<< "$conf"); }
          echo "- Langues de traduction : non livrées (téléchargées depuis Réglages)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MAJ" = "true" ]; then
            add "$(jq -nc --arg k "$PUBKEY" '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $k}}}')"
            echo "- Mises à jour automatiques : actives" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Mises à jour automatiques : inactives (clé de signature absente)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$MAC" = "true" ]; then
              for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                if [ -n "${!v}" ]; then { echo "$v<<FIN_REVEL"; echo "${!v}"; echo "FIN_REVEL"; } >> "$GITHUB_ENV"; fi
              done
              echo "- macOS : signé (Developer ID)" >> "$GITHUB_STEP_SUMMARY"
            else
              add '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
              echo "- macOS : signature ad hoc (pas de certificat Developer ID)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ "$WIN" = "true" ]; then
              for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do { echo "$v<<FIN_REVEL"; echo "${!v}"; echo "FIN_REVEL"; } >> "$GITHUB_ENV"; done
              cargo install artifact-signing-cli --locked
              add "$(jq -nc --arg c "artifact-signing-cli -e $SIGN_ENDPOINT -a $SIGN_ACCOUNT -c $SIGN_PROFILE -d Revel %1" '{bundle: {windows: {signCommand: $c}}}')"
              echo "- Windows : signé (Azure Artifact Signing)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Windows : non signé (avertissement SmartScreen)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          args="${{ matrix.target && format('--target {0}', matrix.target) || '' }}"
          if [ "$conf" != "{}" ]; then
            echo "$conf" > apps/revel-app/tauri.ci.json
            args="$args --config tauri.ci.json"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/revel-app
          tauriScript: cargo tauri
          args: ${{ steps.conf.outputs.args }}
          tagName: v__VERSION__
          releaseName: Revel v__VERSION__
          releaseBody: Installateurs de test ; signatures et mises à jour selon le résumé de la construction.
          releaseDraft: true
          prerelease: true
      # L'application ne doit dépendre que de bibliothèques présentes sur tout système
      # (pas de Homebrew sous macOS : rien n'y est installé chez l'utilisateur).
      - name: Bibliothèques liées (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bin=$(ls target/${{ matrix.target }}/release/revel-app 2>/dev/null || ls target/release/revel-app)
          otool -L "$bin" | tee -a "$GITHUB_STEP_SUMMARY"
          if otool -L "$bin" | grep -E '/opt/homebrew|/usr/local/(opt|Cellar|lib)'; then
            echo "::error::L'application dépend d'une bibliothèque Homebrew"; exit 1
          fi
      - name: Bibliothèques liées (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ldd target/release/revel-app | tee -a "$GITHUB_STEP_SUMMARY"
          if ldd target/release/revel-app | grep 'not found'; then exit 1; fi
