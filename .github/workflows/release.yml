# Installateurs Windows (MSI/NSIS), macOS (DMG) et Linux (AppImage/deb/rpm).
# Déclenché par une étiquette `v*` (ex. v0.1.0) ou à la main. Crée une version
# GitHub en brouillon : rien n'est publié sans validation manuelle.
# Référence : https://tauri.app/distribute/pipelines/github/
name: Installateurs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      plateformes:
        description: "Systèmes à construire"
        type: choice
        options: [tous, windows, macos, linux]
        default: tous

jobs:
  # Systèmes à construire (lancement manuel : seulement ceux demandés, les minutes macOS sont coûteuses).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        env:
          CHOIX: ${{ inputs.plateformes || 'tous' }}
        run: |
          # Ubuntu 22.04 : glibc plus ancienne, AppImage compatible avec plus de distributions.
          all='[
            {"platform":"macos-latest","target":"aarch64-apple-darwin","os":"macos"},
            {"platform":"macos-latest","target":"x86_64-apple-darwin","os":"macos"},
            {"platform":"ubuntu-22.04","target":"","os":"linux"},
            {"platform":"windows-latest","target":"","os":"windows"}]'
          if [ "$CHOIX" = "tous" ]; then sel="$all"; else sel=$(echo "$all" | jq -c --arg o "$CHOIX" '[.[] | select(.os == $o)]'); fi
          echo "matrix=$(echo "$sel" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  bundle:
    needs: plan
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      # NASM : encodeur AVIF (rav1e) optimisé.
      - uses: ilammy/setup-nasm@v1
      - name: Rust (version de rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.target }}" ]; then rustup target add ${{ matrix.target }}; fi
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Outil Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/revel-app
          tauriScript: cargo tauri
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: v__VERSION__
          releaseName: Revel v__VERSION__
          releaseBody: Installateurs de test, non signés.
          releaseDraft: true
          prerelease: true
