[package]
name = "revel-import"
description = "Import de sites existants (Eleventy, HTML statique) vers un projet Revel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
revel-model.workspace = true
revel-markup.workspace = true
revel-render.workspace = true
revel-edit.workspace = true
revel-style.workspace = true
revel-project.workspace = true
# Outil qui construit un site (SvelteKit, Hugo…) : reconnu comme pour sa construction.
revel-build.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex = "1.13.1"
serde-saphyr = "1.3.0"
# Lecture du HTML comme un navigateur (html5ever), déjà présente par Tauri (wry).
dom_query = { version = "0.28.0", default-features = false }
# Import depuis un lien (7.4) : lecture d'un site publié.
ureq = { version = "3.4.2", features = ["platform-verifier"] }
url = "2.5.8"
percent-encoding = "2.3.2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# Fichier d'export de WordPress (7.6).
roxmltree = "0.21.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
