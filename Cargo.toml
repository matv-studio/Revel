[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# Interface WebAssembly : espace de travail séparé (cible wasm32, construite par Trunk).
exclude = ["apps/revel-ui"]
default-members = ["crates/*", "apps/revel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["MATV Studio"]
publish = false
repository = "https://github.com/matv-studio/revel"

[workspace.dependencies]
# Modules internes (une crate par module, dépendances par chemin)
revel-model = { path = "crates/revel-model" }
revel-render = { path = "crates/revel-render" }
revel-assets = { path = "crates/revel-assets" }
revel-cms = { path = "crates/revel-cms" }
revel-deploy = { path = "crates/revel-deploy" }
revel-dns = { path = "crates/revel-dns" }
revel-git = { path = "crates/revel-git" }
revel-mcp = { path = "crates/revel-mcp" }
revel-i18n = { path = "crates/revel-i18n" }
revel-import = { path = "crates/revel-import" }
revel-markup = { path = "crates/revel-markup" }
revel-core = { path = "crates/revel-core" }
revel-project = { path = "crates/revel-project" }
revel-protocol = { path = "crates/revel-protocol" }
revel-edit = { path = "crates/revel-edit" }
revel-style = { path = "crates/revel-style" }

# Bibliothèques externes (versions vérifiées sur crates.io le 13/10/2026)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
clap = { version = "4.6.7", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-build = { version = "2.7.2", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Les dépendances d'images sont optimisées même en développement (sinon l'encodage est très lent).
# Sans informations de débogage pour les dépendances : dossier `target` bien plus léger
# (les machines de CI ont un disque limité).
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
